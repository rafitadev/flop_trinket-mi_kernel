# Coloque em: .github/workflows/build-ginkgo-perf.yml  (no SEU fork do flop_trinket-mi_kernel, branch floppy-unity)
# Se o fork ainda nao tem o perfil Perf, coloque tambem o floppy-perf.patch em .github/floppy-perf.patch
name: Build Floppy Perf (ginkgo + KernelSU Next)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Alvo (ginkgo = so Redmi Note 8/8T; mitrinket = ginkgo + laurel)"
        default: "ginkgo"
        type: choice
        options: [ginkgo, mitrinket]
      options:
        description: "Flags do do_build.sh (k = KernelSU Next+SUSFS, p = Perf, R = release)"
        default: "kp"
        type: string
      clang:
        description: "Toolchain"
        default: "aosp"
        type: choice
        options: [aosp, proton, greenforce, zyc]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   # 22.04 por causa do libtinfo5 que o deps.sh do repo pede
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Aplicar perfil Perf (se ainda nao existir)
        working-directory: kernel
        run: |
          if [ ! -f arch/arm64/configs/perf.config ]; then
            test -f .github/floppy-perf.patch || { echo "Falta .github/floppy-perf.patch"; exit 1; }
            git apply --index .github/floppy-perf.patch
          fi

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lz4 brotli flex bison bc cpio kmod zip ccache \
            binutils-aarch64-linux-gnu libtinfo5 python3 libssl-dev curl

      - name: Compilar
        working-directory: kernel
        env:
          WP: ${{ github.workspace }}
          CLANG_TYPE: ${{ inputs.clang }}
        run: |
          set -o pipefail
          ./do_build.sh "${{ inputs.target }}" ${{ inputs.options }} 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publicar log na branch build-logs
        if: always()
        working-directory: kernel
        run: |
          git config user.name "build-bot"; git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/logs
          tail -n 250 "$GITHUB_WORKSPACE/build.log" > /tmp/logs/tail.txt || true
          grep -n -E "error:|Error [0-9]|\*\*\*|undefined reference|fatal|No rule" "$GITHUB_WORKSPACE/build.log" | head -120 > /tmp/logs/errors.txt || true
          git checkout -q --orphan build-logs
          git rm -rf -q . || true
          cp /tmp/logs/*.txt .
          git add -f tail.txt errors.txt
          git commit -q -m "build log ${{ github.run_id }}"
          git push -f origin build-logs

      - name: Enviar zip
        uses: actions/upload-artifact@v4
        with:
          name: Floppy-Perf-${{ inputs.target }}
          path: kernel/build/Floppy_*.zip
          if-no-files-found: error
